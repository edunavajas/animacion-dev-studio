name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: tipado y pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Se preparan los sidecars REALES (navegador incluido): las pruebas deben
      # correr por el mismo camino que la app, no por uno recortado.
      - name: Preparar sidecars
        run: node scripts/fetch-sidecars.mjs
      - run: npm run typecheck
      - name: Pruebas de integración (Electron headless)
        run: npm run test:integration
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: '1'

  dist:
    name: instalador (${{ matrix.os }})
    needs: verify
    if: github.event_name != 'pull_request'
    # Necesario para publicar la release cuando se empuja un tag v*.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            chrome: mac_arm
          - os: windows-latest
            chrome: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preparar sidecars (navegador + runtime + plantillas)
        run: node scripts/fetch-sidecars.mjs
        env:
          CHROME_PLATFORM: ${{ matrix.chrome }}
      - run: npm run build
      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --publish never
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      # Verifica el PAQUETE: que resuelve sus propios componentes sin nada del sistema.
      - name: Diagnóstico del paquete (macOS)
        if: runner.os == 'macOS'
        run: '"release/mac-arm64/animacion-dev Studio.app/Contents/MacOS/animacion-dev Studio" --diagnose'
      - name: Diagnóstico del paquete (Windows)
        if: runner.os == 'Windows'
        run: '& "release/win-unpacked/animacion-dev Studio.exe" --diagnose'
      # Prueba REAL del instalador en Windows: instalar en silencio y comprobar que
      # la app queda instalada y funciona. Es justo lo que no se puede verificar
      # desde un Mac.
      - name: Instalar en Windows en silencio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter '*.exe' | Where-Object { $_.Name -notlike '*unpacked*' } | Select-Object -First 1
          if (-not $exe) { throw 'No se encontró el instalador NSIS' }
          Write-Host "Instalador: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'animacion-dev Studio.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'El instalador no dejó la app instalada en LOCALAPPDATA\Programs' }
          Write-Host "Instalada en: $($app.FullName)"
          & $app.FullName --diagnose
          if ($LASTEXITCODE -ne 0) { throw "La app instalada no resuelve sus componentes (exit $LASTEXITCODE)" }
      # Simula una actualización con las MISMAS banderas que usa la app y comprueba
      # que el instalador la relanza solo (--force-run solo actúa si es silencioso).
      - name: Actualizar en Windows y comprobar el relanzado
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter '*.exe' | Where-Object { $_.Name -notlike '*unpacked*' } | Select-Object -First 1
          Write-Host 'Lanzando con: --updated /S --force-run'
          Start-Process -FilePath $exe.FullName -ArgumentList '--updated','/S','--force-run'
          Start-Sleep -Seconds 30
          $proc = Get-Process -Name 'animacion-dev Studio' -ErrorAction SilentlyContinue
          if (-not $proc) { throw 'El instalador no relanzó la app tras la actualización' }
          Write-Host "La app se relanzó sola tras actualizar: OK (pid $($proc.Id -join ','))"
          $proc | Stop-Process -Force
      # Con un tag v* se publica la release y los instaladores quedan descargables.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.msi
          generate_release_notes: true
          # Cada plataforma aporta lo suyo: en macOS no hay .exe y en Windows no hay .dmg.
          fail_on_unmatched_files: false
      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.msi
            release/*.zip
          if-no-files-found: error
          retention-days: 14
