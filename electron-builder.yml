appId: dev.animacion.studio
productName: animacion-dev Studio
copyright: © 2026 Eduardo Navajas

directories:
  output: release
  buildResources: build

# El código de la app va dentro del asar; los binarios y dependencias nativas
# (chrome-headless-shell, ffmpeg/ffprobe, hyperframes y sus módulos) se extraen
# para poder ejecutarlos como sidecars.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

asarUnpack:
  - node_modules/**/*

extraResources:
  - from: resources/player
    to: player
  - from: resources/chrome
    to: chrome
  - from: resources/templates
    to: templates

mac:
  category: public.app-category.video
  # arm64 por defecto (Macs actuales). Para x64: añadir "x64" aquí y preparar
  # los sidecars con CHROME_PLATFORM=mac KEEP_PLATFORMS=darwin/x64 (ver docs).
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # v1 se distribuye SIN firmar, pero hay que firmar ad-hoc igualmente: si no,
  # electron-builder omite la firma y el bundle conserva la firma "linker" del
  # Electron original, ya inválida porque le hemos añadido recursos. macOS lo
  # tolera sin cuarentena, pero si el .dmg se descarga desde un navegador
  # (cuarentena activa) el sistema dice «la app está dañada» y clic derecho →
  # Abrir NO lo salva. Con firma ad-hoc válida, el aviso es el normal de
  # «desarrollador no identificado» y sí se puede abrir.
  # Al comprar un Developer ID: quitar esta línea y definir CSC_LINK +
  # CSC_KEY_PASSWORD (o poner aquí el nombre del certificado).
  identity: '-'

dmg:
  title: animacion-dev Studio

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: animacion-dev Studio

msi:
  oneClick: false
