<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
        overflow: hidden;
      }
      .icon {
        width: 1024px;
        height: 1024px;
        display: grid;
        place-items: center;
      }
      .squircle {
        width: 820px;
        height: 820px;
        border-radius: 186px;
        background: #5646e0;
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="squircle">
        <!-- Fotograma detrás + marco con reproducción: "animación en capas".
             El marco frontal se rellena con el fondo para tapar el de detrás. -->
        <svg width="430" height="430" viewBox="0 0 200 200" fill="none">
          <rect
            x="28"
            y="28"
            width="116"
            height="116"
            rx="28"
            fill="#FFFFFF"
            fill-opacity="0.3"
          />
          <rect x="58" y="58" width="116" height="116" rx="28" fill="#5646E0" />
          <rect
            x="58"
            y="58"
            width="116"
            height="116"
            rx="28"
            stroke="#FFFFFF"
            stroke-width="14"
          />
          <path d="M104 96 L136 116 L104 136 Z" fill="#FFFFFF" />
        </svg>
      </div>
    </div>
  </body>
</html>
