<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"clip","type":"string","label":"Vídeo con sonido","default":"assets/clip.mp4"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Prueba de audio</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        font-family: Inter, system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #v {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="prueba-audio"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
      data-fps="30"
    >
      <!-- data-has-audio="true" conserva el sonido del vídeo; sin esto el render lo tira. -->
      <video
        id="v"
        class="clip"
        data-start="0"
        data-duration="5"
        data-has-audio="true"
        data-volume="1"
        data-var-src="clip"
        src="assets/clip.mp4"
        playsinline
      ></video>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 5 });
      window.__timelines['prueba-audio'] = tl;
    </script>
  </body>
</html>
